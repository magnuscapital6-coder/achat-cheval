name: Vérifications

# Typage, tests d'intégration des routes API (dans workerd, avec une base D1
# locale) puis build : le Worker et les assets sont produits par la même
# commande que celle utilisée pour déployer.
on:
  push:

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typage-et-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 demande Node 22.12 au minimum ; 24 est la LTS au moment de
          # l'écriture du dépôt.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typage
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
